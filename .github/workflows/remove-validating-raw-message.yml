name: Remove RAW validation startup message

on:
  push:
    branches:
      - phase/01-foundation-discovery
    paths:
      - '.github/workflows/remove-validating-raw-message.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/01-foundation-discovery
          fetch-depth: 0
      - name: Remove startup validation message
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('feature-camera/src/main/kotlin/com/camera/feature/camera/CameraBootstrapScreen.kt')
          text = path.read_text()
          old = '''        snapshot == null -> {
              Text("Validating RAW camera hardware…", color = Color.White.copy(alpha = 0.86f), fontSize = 13.sp)
          }
'''
          if old not in text:
              raise SystemExit('startup validation message block not found')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Commit clean UI change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-validating-raw-message.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature-camera/src/main/kotlin/com/camera/feature/camera/CameraBootstrapScreen.kt .github/workflows/remove-validating-raw-message.yml
          git commit -m "ui: hide RAW validation startup status"
          git push origin HEAD:phase/01-foundation-discovery
