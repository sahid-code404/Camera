name: Android CI

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'experiment/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Gradle version
        run: bash ./gradlew --version

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: bash ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camera-phase-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish development OTA channel
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          APK_REL="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK_REL"
          APK_ABS="$GITHUB_WORKSPACE/$APK_REL"
          OTA_NAME="Camera-dev-${GITHUB_RUN_NUMBER}.apk"
          TMP_DIR="$(mktemp -d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ota || true

          if git show-ref --verify --quiet refs/remotes/origin/ota; then
            git worktree add "$TMP_DIR" origin/ota
            cd "$TMP_DIR"
            git checkout -B ota origin/ota
          else
            git worktree add --detach "$TMP_DIR"
            cd "$TMP_DIR"
            git checkout --orphan ota
            git rm -rf . || true
          fi

          rm -f Camera-dev-*.apk
          cp "$APK_ABS" "$OTA_NAME"
          SHA256="$(sha256sum "$OTA_NAME" | awk '{print $1}')"

          cat > update.json <<EOF
          {
            "versionCode": ${GITHUB_RUN_NUMBER},
            "versionName": "0.2.0-dev.${GITHUB_RUN_NUMBER}-debug",
            "apkUrl": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ota/${OTA_NAME}",
            "sha256": "${SHA256}"
          }
          EOF

          git add -A
          git commit -m "ota: publish dev build ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:ota
