name: Android CI

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'experiment/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-shot lightning startup optimization
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase/01-foundation-discovery'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/lightning_startup_patch.py
          git show 7faa55248e9ea5940d039501c8ab4f2b530afb7d:.github/workflows/android.yml > .github/workflows/android.yml
          rm -f .github/workflows/lightning-parallel-startup.yml scripts/lightning_startup_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            camera-camera2/src/main/kotlin/com/camera/camera/camera2/AndroidCameraCatalog.kt \
            camera-camera2/src/main/kotlin/com/camera/camera/camera2/ValidatedCameraCatalog.kt \
            feature-camera/src/main/kotlin/com/camera/feature/camera/CameraBootstrapScreen.kt \
            feature-camera/src/main/kotlin/com/camera/feature/camera/Camera2PreviewController.kt \
            .github/workflows/android.yml \
            .github/workflows/lightning-parallel-startup.yml \
            scripts/lightning_startup_patch.py
          git commit -m "perf: parallelize lightning camera startup"
          git push origin HEAD:phase/01-foundation-discovery

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools

      - name: Install Android SDK + native toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Gradle version
        run: bash ./gradlew --version

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: bash ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camera-phase-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish development OTA channel
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          APK_REL="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK_REL"
          APK_ABS="$GITHUB_WORKSPACE/$APK_REL"
          OTA_NAME="Camera-dev-${GITHUB_RUN_NUMBER}.apk"
          OTA_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          TMP_DIR="$(mktemp -d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ota || true

          if git show-ref --verify --quiet refs/remotes/origin/ota; then
            git worktree add "$TMP_DIR" origin/ota
            cd "$TMP_DIR"
            git checkout -B ota origin/ota
          else
            git worktree add --detach "$TMP_DIR"
            cd "$TMP_DIR"
            git checkout --orphan ota
            git rm -rf . || true
          fi

          rm -f Camera-dev-*.apk
          cp "$APK_ABS" "$OTA_NAME"
          SHA256="$(sha256sum "$OTA_NAME" | awk '{print $1}')"

          cat > update.json <<EOF
          {
            "versionCode": ${OTA_VERSION_CODE},
            "versionName": "0.3.0-linear.${GITHUB_RUN_NUMBER}-debug",
            "apkUrl": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ota/${OTA_NAME}",
            "sha256": "${SHA256}"
          }
          EOF

          git add -A
          git commit -m "ota: publish linear dev build ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:ota
