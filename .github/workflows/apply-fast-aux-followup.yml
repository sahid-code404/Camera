name: Apply fast AUX follow-up

on:
  push:
    branches:
      - phase/01-foundation-discovery
    paths:
      - '.github/scripts/apply_fast_aux_followup.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/01-foundation-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_fast_aux_followup.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            camera-camera2/src/main/kotlin/com/camera/camera/camera2/AndroidCameraCatalog.kt \
            feature-camera/src/main/kotlin/com/camera/feature/camera/CameraBootstrapScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "perf: defer deep AUX scan until preview is live"
          git push origin HEAD:phase/01-foundation-discovery
