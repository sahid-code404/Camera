name: Apply fast AUX discovery patch

on:
  push:
    branches:
      - phase/01-foundation-discovery
    paths:
      - '.github/scripts/apply_fast_aux_discovery.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/01-foundation-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_fast_aux_discovery.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            core-model/src/main/kotlin/com/camera/core/model/CameraModels.kt \
            camera-capability/src/main/kotlin/com/camera/camera/capability/ValuableCameraResolver.kt \
            camera-camera2/src/main/kotlin/com/camera/camera/camera2/AndroidCameraCatalog.kt \
            camera-camera2/src/main/kotlin/com/camera/camera/camera2/NativeCameraNdkBridge.kt \
            camera-camera2/src/main/kotlin/com/camera/camera/camera2/ValidatedCameraCatalog.kt \
            camera-camera2/src/main/kotlin/com/camera/camera/camera2/CameraRouteValidationCache.kt \
            camera-camera2/src/main/cpp/motioncam_camera_ndk.cpp \
            camera-camera2/src/main/cpp/native_camera_session.cpp \
            feature-camera/src/main/kotlin/com/camera/feature/camera/Camera2PreviewController.kt \
            feature-camera/src/main/kotlin/com/camera/feature/camera/CameraBootstrapScreen.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf: make AUX RAW discovery lazy and fast"
          git push origin HEAD:phase/01-foundation-discovery
