name: Progressive camera startup

on:
  push:
    branches:
      - phase/01-foundation-discovery
    paths:
      - '.github/workflows/progressive-camera-startup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/01-foundation-discovery
          fetch-depth: 0
      - name: Apply progressive startup pipeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Add an ultra-cheap primary front/back metadata scan. It stops as soon as one
          # backward-compatible back and one front camera have been found. No NDK, physical-child,
          # or hidden AUX discovery is touched on this critical first-preview path.
          catalog = Path('camera-camera2/src/main/kotlin/com/camera/camera/camera2/AndroidCameraCatalog.kt')
          text = catalog.read_text()
          anchor = '    override suspend fun scan(): CameraCatalogSnapshot = scan(deepScan = false)\n\n'
          primary = '''    override suspend fun scan(): CameraCatalogSnapshot = scan(deepScan = false)\n\n    /**\n     * Critical-path startup scan. Resolve only the first framework-compatible rear and front\n     * cameras, stopping as soon as both are known. This deliberately avoids NDK enumeration,\n     * logical physical-member expansion, and hidden AUX probing so first preview can start with\n     * the least possible camera-service work.\n     */\n    suspend fun scanPrimaryCameras(): CameraCatalogSnapshot = withContext(Dispatchers.Default) {\n        val javaIds = runCatching { manager.cameraIdList.toList() }.getOrDefault(emptyList())\n        var firstBack: Pair<String, CameraCharacteristics>? = null\n        var firstFront: Pair<String, CameraCharacteristics>? = null\n        var firstCompatible: Pair<String, CameraCharacteristics>? = null\n\n        for (id in javaIds) {\n            val chars = runCatching { manager.getCameraCharacteristics(id) }.getOrNull() ?: continue\n            val capabilities = chars\n                .get(CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES)\n                ?.toSet()\n                .orEmpty()\n            if (CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES_BACKWARD_COMPATIBLE !in capabilities) {\n                continue\n            }\n            if (firstCompatible == null) firstCompatible = id to chars\n            when (facingOf(chars.get(CameraCharacteristics.LENS_FACING))) {\n                LensFacing.BACK -> if (firstBack == null) firstBack = id to chars\n                LensFacing.FRONT -> if (firstFront == null) firstFront = id to chars\n                else -> Unit\n            }\n            if (firstBack != null && firstFront != null) break\n        }\n\n        val selected = buildList {\n            firstBack?.let(::add)\n            firstFront?.let { front -> if (none { it.first == front.first }) add(front) }\n            if (isEmpty()) firstCompatible?.let(::add)\n        }\n        val profiles = selected.map { (id, chars) ->\n            buildJavaProfile(\n                routeCameraId = id,\n                physicalCameraId = null,\n                parentLogicalCameraId = null,\n                routeKind = CameraRouteKind.ENUMERATED,\n                characteristics = chars,\n                inheritedFacing = null,\n            )\n        }\n        val resolution = ValuableCameraResolver.resolve(profiles)\n        CameraCatalogSnapshot(\n            deviceProfiles = profiles,\n            valuableLenses = resolution.lenses,\n            diagnosticsJson = diagnosticsJson(\n                profiles = profiles,\n                hidden = resolution.hiddenRouteKeys,\n                javaIds = javaIds,\n                ndkIds = emptyList(),\n            ),\n        )\n    }\n\n'''
          if 'suspend fun scanPrimaryCameras()' not in text:
              if anchor not in text:
                  raise SystemExit('AndroidCameraCatalog insertion anchor not found')
              text = text.replace(anchor, primary, 1)
              catalog.write_text(text)

          # 2) Reuse validation/cache filtering for both the primary micro-scan and the full scans.
          validated = Path('camera-camera2/src/main/kotlin/com/camera/camera/camera2/ValidatedCameraCatalog.kt')
          text = validated.read_text()
          old = '''suspend fun AndroidCameraCatalog.scanValidated(\n    context: Context,\n    deepScan: Boolean = false,\n): CameraCatalogSnapshot {\n    val metadata = scan(deepScan = deepScan)\n    val profiles = metadata.deviceProfiles\n    if (profiles.isEmpty()) return metadata\n\n    val cache = CameraRouteValidationCache.prepare(context, profiles)\n    val profileByKey = profiles.associateBy(::routeKey)\n    val candidateKeys = profileByKey.keys - cache.rejectedRouteKeys\n    val resolution = ValuableCameraResolver.resolve(profiles, candidateKeys)\n    val selectedKeys = resolution.lenses.mapTo(mutableSetOf(), ::routeKey)\n\n    val cachedResults = cache.allUsableRouteKeys\n        .filter { it in selectedKeys }\n        .mapNotNull { key ->\n            val profile = profileByKey[key] ?: return@mapNotNull null\n            CameraRouteProbeResult(\n                routeCameraId = profile.routeCameraId,\n                physicalCameraId = profile.physicalCameraId,\n                status = CameraRouteProbeStatus.SESSION_CONFIGURED,\n                message = when (cache.level(key)) {\n                    CameraRouteValidationCache.TrustLevel.RAW -> "Cached RAW verified"\n                    CameraRouteValidationCache.TrustLevel.SESSION -> "Cached preview/session verified"\n                    null -> "Cached route"\n                },\n            )\n        }\n\n    return metadata.copy(\n        valuableLenses = resolution.lenses,\n        routeProbeResults = cachedResults,\n    )\n}\n'''
          new = '''suspend fun AndroidCameraCatalog.scanPrimaryValidated(\n    context: Context,\n): CameraCatalogSnapshot = validateMetadata(context, scanPrimaryCameras())\n\nsuspend fun AndroidCameraCatalog.scanValidated(\n    context: Context,\n    deepScan: Boolean = false,\n): CameraCatalogSnapshot = validateMetadata(context, scan(deepScan = deepScan))\n\nprivate suspend fun validateMetadata(\n    context: Context,\n    metadata: CameraCatalogSnapshot,\n): CameraCatalogSnapshot {\n    val profiles = metadata.deviceProfiles\n    if (profiles.isEmpty()) return metadata\n\n    val cache = CameraRouteValidationCache.prepare(context, profiles)\n    val profileByKey = profiles.associateBy(::routeKey)\n    val candidateKeys = profileByKey.keys - cache.rejectedRouteKeys\n    val resolution = ValuableCameraResolver.resolve(profiles, candidateKeys)\n    val selectedKeys = resolution.lenses.mapTo(mutableSetOf(), ::routeKey)\n\n    val cachedResults = cache.allUsableRouteKeys\n        .filter { it in selectedKeys }\n        .mapNotNull { key ->\n            val profile = profileByKey[key] ?: return@mapNotNull null\n            CameraRouteProbeResult(\n                routeCameraId = profile.routeCameraId,\n                physicalCameraId = profile.physicalCameraId,\n                status = CameraRouteProbeStatus.SESSION_CONFIGURED,\n                message = when (cache.level(key)) {\n                    CameraRouteValidationCache.TrustLevel.RAW -> "Cached RAW verified"\n                    CameraRouteValidationCache.TrustLevel.SESSION -> "Cached preview/session verified"\n                    null -> "Cached route"\n                },\n            )\n        }\n\n    return metadata.copy(\n        valuableLenses = resolution.lenses,\n        routeProbeResults = cachedResults,\n    )\n}\n'''
          if 'scanPrimaryValidated' not in text:
              if old not in text:
                  raise SystemExit('ValidatedCameraCatalog function block not found')
              validated.write_text(text.replace(old, new, 1))

          # 3) Stage startup: primary front/back -> first preview -> advertised full discovery -> deep hidden scan.
          screen = Path('feature-camera/src/main/kotlin/com/camera/feature/camera/CameraBootstrapScreen.kt')
          text = screen.read_text()
          if 'import com.camera.camera.camera2.scanPrimaryValidated' not in text:
              text = text.replace(
                  'import com.camera.camera.camera2.scanValidated\n',
                  'import com.camera.camera.camera2.scanPrimaryValidated\nimport com.camera.camera.camera2.scanValidated\n',
                  1,
              )
          text = text.replace(
              '    var deepDiscoveryDone by remember { mutableStateOf(false) }\n',
              '    // 0=primary-only, 1=advertised routes complete, 2=deep hidden-AUX complete.\n    var discoveryStage by remember { mutableStateOf(0) }\n',
              1,
          )
          old_start = '''    LaunchedEffect(cameraPermissionGranted) {\n        if (!cameraPermissionGranted) return@LaunchedEffect\n        discoveryError = null\n        // Fast path is metadata-only: never serially open/configure every camera before the UI.\n        // Real preview/capture validates a route lazily and persists that result. After first render,\n        // perform a bounded metadata-only NDK deep scan to discover vendor-hidden numeric AUX IDs.\n        val fast = runCatching { catalog.scanValidated(context, deepScan = false) }\n            .onFailure { discoveryError = it.message ?: it.javaClass.simpleName }\n            .getOrNull()\n        if (fast != null) {\n            snapshot = fast\n            deepDiscoveryDone = false\n            if (fast.valuableLenses.none { it.rawSupported }) {\n                runCatching { catalog.scanValidated(context, deepScan = true) }\n                    .onSuccess { deep -> snapshot = deep }\n                deepDiscoveryDone = true\n            }\n        }\n    }\n\n    LaunchedEffect(cameraPermissionGranted, previewState, deepDiscoveryDone) {\n        if (!cameraPermissionGranted || deepDiscoveryDone || previewState !is PreviewState.Streaming) {\n            return@LaunchedEffect\n        }\n        deepDiscoveryDone = true\n        kotlinx.coroutines.delay(250L)\n        runCatching { catalog.scanValidated(context, deepScan = true) }\n            .onSuccess { deep -> snapshot = deep }\n    }\n'''
          new_start = '''    LaunchedEffect(cameraPermissionGranted) {\n        if (!cameraPermissionGranted) return@LaunchedEffect\n        discoveryError = null\n        discoveryStage = 0\n\n        // First-frame path: inspect only enough framework metadata to find the normal rear main\n        // and normal front camera. Do not touch NDK/physical/hidden AUX discovery yet.\n        val primaryResult = runCatching { catalog.scanPrimaryValidated(context) }\n        val primary = primaryResult.getOrNull()\n        if (primary != null && primary.valuableLenses.any { it.rawSupported }) {\n            snapshot = primary\n            return@LaunchedEffect\n        }\n\n        // Some OEMs expose RAW for the main route only through the native alias. If the micro-scan\n        // cannot produce a usable RAW preview, fall back immediately to advertised metadata so the\n        // app still starts instead of waiting for a preview that can never stream.\n        val advertisedResult = runCatching { catalog.scanValidated(context, deepScan = false) }\n        val advertised = advertisedResult.getOrNull()\n        if (advertised != null) {\n            snapshot = advertised\n            discoveryStage = 1\n        }\n        if (advertised != null && advertised.valuableLenses.any { it.rawSupported }) {\n            return@LaunchedEffect\n        }\n\n        // No advertised RAW route: only now pay for the bounded hidden numeric AUX scan.\n        val deepResult = runCatching { catalog.scanValidated(context, deepScan = true) }\n        deepResult.onSuccess { deep -> snapshot = deep }\n        discoveryStage = 2\n        if (snapshot == null) {\n            val failure = deepResult.exceptionOrNull()\n                ?: advertisedResult.exceptionOrNull()\n                ?: primaryResult.exceptionOrNull()\n            discoveryError = failure?.message ?: failure?.javaClass?.simpleName ?: "Camera discovery failed"\n        }\n    }\n\n    LaunchedEffect(cameraPermissionGranted, previewState) {\n        if (!cameraPermissionGranted || discoveryStage >= 2) return@LaunchedEffect\n        val previewReady = previewState is PreviewState.Streaming\n        val previewFailed = previewState is PreviewState.Error\n        if (!previewReady && !previewFailed) return@LaunchedEffect\n\n        // Let the first rear-main preview frame win the camera-service/CPU race. Discovery resumes\n        // only after the user already has a working viewfinder. A failed primary preview skips the\n        // cosmetic settle delay so alternate routes can be found immediately.\n        if (previewReady) kotlinx.coroutines.delay(120L)\n\n        if (discoveryStage == 0) {\n            runCatching { catalog.scanValidated(context, deepScan = false) }\n                .onSuccess { advertised -> snapshot = advertised }\n            discoveryStage = 1\n        }\n\n        if (previewReady) kotlinx.coroutines.delay(250L)\n        if (discoveryStage == 1) {\n            runCatching { catalog.scanValidated(context, deepScan = true) }\n                .onSuccess { deep -> snapshot = deep }\n            discoveryStage = 2\n        }\n    }\n'''
          if old_start not in text:
              raise SystemExit('CameraBootstrapScreen startup block not found')
          screen.write_text(text.replace(old_start, new_start, 1))
          PY
      - name: Commit progressive startup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/progressive-camera-startup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- camera-camera2/src/main/kotlin/com/camera/camera/camera2/AndroidCameraCatalog.kt \
            camera-camera2/src/main/kotlin/com/camera/camera/camera2/ValidatedCameraCatalog.kt \
            feature-camera/src/main/kotlin/com/camera/feature/camera/CameraBootstrapScreen.kt \
            .github/workflows/progressive-camera-startup.yml
          git commit -m "perf: stream main camera before AUX discovery"
          git push origin HEAD:phase/01-foundation-discovery
